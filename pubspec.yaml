name: denta
description: "Dental application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1

  # Storage
  shared_preferences: ^2.5.6

  # Dependency Injection & Service Locator
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Networking
  dio: ^5.11.1

  # Routing
  go_router: ^18.0.2

  # UI & Styling
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  skeletonizer: ^3.0.0

  # Internationalization & Utilities
  intl: any

dev_dependencies:

  # Code Generation
  build_runner: 2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  lean_builder: ^1.2.2
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
